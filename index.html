<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="烤肉王 Roast Online"><title>烤肉王 Roast Online</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="mode-nav"><button class="mode-btn active" data-mode="timing">🎯 火候挑戰</button><button class="mode-btn" data-mode="flip">🔥 翻肉進階版</button></nav><main class="app"><section class="game-card" id="timingGame"><header class="header"><div><small>ROAST ONLINE</small><h1>🔥 烤肉王</h1></div><div class="stats"><span>回合 <b id="round">0 / 3</b></span><span>總分 <b id="score">0</b></span><span>Combo <b id="combo">×0</b></span></div></header><div class="target"><span>本次目標</span><strong id="target">準備開烤</strong><p id="hint">每局 3 片肉，越接近指定熟度越高分。</p></div><div class="grill-scene"><div class="smoke s1"></div><div class="smoke s2"></div><div class="smoke s3"></div><div class="grill"><div class="bars"></div><div id="meat" class="meat raw"><i></i><i></i><i></i></div><div class="coals"><i></i><i></i><i></i><i></i><i></i></div><div class="flames"><i></i><i></i><i></i><i></i><i></i></div></div></div><div class="result"><strong id="feedback">準備好了嗎？</strong><span id="detail">按下開始遊戲</span><em id="timer">0.00 秒</em></div><button id="action" class="action">開始遊戲</button></section><section class="game-card flip-game hidden" id="flipGame"><header class="header"><div><small>ADVANCED MODE</small><h1>🥩 翻肉大作戰</h1></div><div class="stats"><span>時間 <b id="flipTime">45</b></span><span>分數 <b id="flipScore">0</b></span></div></header><div class="flip-rules"><span>熟肉起鍋 <b>+10</b></span><span>生肉起鍋 <b>-5</b></span><span>焦掉 <b>-10</b></span></div><p class="flip-help">點一下＝翻面；點兩下＝夾到盤子。熟肉 +10、生肉 -5、焦肉 -10。</p><div class="flip-area"><div class="flip-grill" id="flipGrill"></div><div class="plate-wrap"><div class="plate" id="flipPlate"><span>🍽️</span><small>起鍋區</small></div></div></div><div class="flip-message" id="flipMessage">45 秒內顧好整網烤肉！</div><button id="flipAction" class="action">開始進階挑戰</button></section><aside class="board"><div class="board-title"><div><small>LIVE BOARD</small><h2>🏆 TOP 10</h2></div><button id="refresh">更新</button></div><ol id="leaderboard"><li class="empty">讀取排行榜中…</li></ol></aside></main><dialog id="finishDialog"><form id="finishForm"><div class="trophy">🏆</div><h2>烤肉完成！</h2><p>本局總分</p><strong id="finalScore" class="final-score">0</strong><label>玩家名稱<input id="playerName" maxlength="16" required placeholder="輸入你的名字"></label><p id="saveStatus" class="save-status"></p><div class="dialog-actions"><button type="button" id="again">再玩一次</button><button class="action" type="submit">送上排行榜</button></div></form></dialog><script type="module" src="js/game.js"></script><script src="js/flip-game.js"></script></body></html>
